

parameters:
  data_dim: &data_dim 58
  embedding_dim: &embedding_dim 128
  input_dim: &input_dim 186
  num_nodes: &num_nodes 576289


seed: 42

data_parameters:
  dataset_type: ogbl-ppa
  # transforms: 
    # - "normalize_features"
  to_undirected: false
  add_self_loops_and_remove_duplicate_edges: false
  remove_duplicate_edges: false
  train_data_loader_parameters:
    data_loader_type: link_loader
    batch_size: 65536
    mask_loss_edges: false
    max_rejection_sampling_iterations: 2
    negative_sampling_ratio: 0.5
    on_device: true
  val_data_loader_parameters:
    data_loader_type: link_loader
    batch_size: 8388608
    negative_sampling_ratio: 0.5
    on_device: true
  test_data_loader_parameters:
    data_loader_type: link_loader
    batch_size: 8388608
    negative_sampling_ratio: 0.5
    on_device: true

model_parameters:
  task_type: link_prediction


  embedder_parameters:
    use_embedding: true
    embedding_dim : *embedding_dim
    embedding_only: false
    initializer: orthogonal
    num_nodes: *num_nodes

  architecture_parameters:
      architecture_type: sgc2
      input_dim: *input_dim
      hidden_dim: 512
      output_dim: 128
      num_layers: 2
      dropout: 0.2
      use_input_projection: false
      use_output_projection: false
      use_residual: false
      use_layer_norm: false

  link_predictor_parameters:
    link_predictor_type: hadamard_mlp
    parameters:
      dropout: 0.2
      num_layers: 5
      use_residual: false
      use_layer_norm: true

  loss:
      loss_type: bce_with_logits_loss

  metrics:
    - metric_type: hit_rate
      display_name: hit_rate@20
      parameters:
        k: 20
    - metric_type: hit_rate
      display_name: hit_rate@100
      parameters:
        k: 100
    - metric_type: binary_accuracy
      display_name: accuracy
    # - metric_type: mean_reciprocal_rank
    #   display_name: mrr

  optimizer:
    optimizer_type: adam
    parameters:
      lr: 0.0005
      weight_decay: 0

callbacks: 
    # - callback_type: early_stopping
    #   parameters:
    #     monitor: val/loss
    #     patience: 10
    #     mode: "min"
    - callback_type: model_checkpoint
      parameters:
        monitor: val/accuracy
        mode: max
        save_top_k: 1
        filename: best

wandb_logger_parameters:
  reinit: true

compilation_parameters:
  use_compiled_torch: false
  full_graph: false

trainer_config:
  max_time: 00:01:00:00
  # max_epochs: 200
  log_every_n_steps: 1

